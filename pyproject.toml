[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-lakehouse"
version = "0.6.0"
description = "Plataforma lakehouse de operaciones con arquitectura medallion sobre Delta Lake"
requires-python = ">=3.11"
# Spark y Delta Lake los provee el entorno (Docker o Microsoft Fabric Runtime 1.3).
dependencies = []

[tool.setuptools.packages.find]
include = ["lakehouse*"]

[tool.setuptools.package-data]
lakehouse = ["reference/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
